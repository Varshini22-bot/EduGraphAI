# ==============================================================================
# EduGraphAI - Next.js Frontend Deployment
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: edugraph-frontend
  namespace: edugraphai
  labels:
    app.kubernetes.io/name: edugraphai
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edugraph-frontend
  template:
    metadata:
      labels:
        app: edugraph-frontend
        app.kubernetes.io/name: edugraphai
        app.kubernetes.io/component: frontend
    spec:
      # Security context enforcing non-root container execution
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001

      containers:
        - name: frontend
          image: edugraph-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http

          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: edugraph-config
                  key: NEXT_PUBLIC_API_URL

          # Compute resource requests and limits
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # Health checks
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
