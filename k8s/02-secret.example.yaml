# ==============================================================================
# EduGraphAI - Kubernetes Secret Template
#
# IMPORTANT SECURITY NOTICE:
# 1. Do NOT commit real passwords to Git!
# 2. To create the secret directly via kubectl CLI (RECOMMENDED):
#
#    kubectl create secret generic edugraph-secret \
#      --namespace=edugraphai \
#      --from-literal=NEO4J_PASSWORD="YourStrongPassword123!" \
#      --from-literal=JWT_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')"
#
# 3. Alternatively, copy this file to '02-secret.yaml' (which is gitignored),
#    fill in your passwords below, and apply it:
#
#    cp k8s/02-secret.example.yaml k8s/02-secret.yaml
#    kubectl apply -f k8s/02-secret.yaml
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: edugraph-secret
  namespace: edugraphai
  labels:
    app.kubernetes.io/name: edugraphai
    app.kubernetes.io/component: credentials
type: Opaque
stringData:
  # Password for Neo4j database authentication
  NEO4J_PASSWORD: "ChangeMeToStrongPassword123!"

  # 32-byte hex secret key for signing JWT authentication tokens
  JWT_SECRET_KEY: "change-this-to-a-secure-random-32-byte-hex-string"

  # API key for hosted cloud LLM provider (Groq, OpenAI, Gemini, etc.) - leave empty if using local Ollama
  LLM_API_KEY: ""
