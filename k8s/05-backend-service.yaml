# ==============================================================================
# EduGraphAI - Backend Service
#
# Exposes the FastAPI backend internally to other cluster pods via port 8000
# and externally to the host browser / frontend client via NodePort 30800.
# ==============================================================================

apiVersion: v1
kind: Service
metadata:
  name: edugraph-backend
  namespace: edugraphai
  labels:
    app.kubernetes.io/name: edugraphai
    app.kubernetes.io/component: backend
spec:
  type: NodePort
  selector:
    app: edugraph-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30800
      protocol: TCP
